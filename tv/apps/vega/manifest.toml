#
# Courtside: a network-only UI app (no media playback). Trimmed from the AmazonAppDev sample manifest.
# If `vega package install` rejects a section, compare with a fresh `vega project generate` manifest.
#
schema-version = 1

[package]
title = "Courtside"
version = "0.1.0"
id = "com.courtside.tv.vega"

[os.version]
min = "1.2"
target = "1.2"

[components]
[[components.interactive]]
id = "com.courtside.tv.vega.main"
runtime-module = "/com.amazon.kepler.keplerscript.runtime.loader_2@IKeplerScript_2_0"
launch-type = "singleton"
categories = [
    "com.amazon.category.main"
]

[processes]
[[processes.group]]
component-ids = ["com.courtside.tv.vega.main"]

[wants]
[[wants.service]]
id = "com.amazon.inputmethod.service"

# Remote button events
[[wants.service]]
id = "com.amazon.inputd.service"

[[wants.service]]
id = "com.amazon.network.service"

[[wants.privilege]]
id = "com.amazon.devconf.privilege.accessibility"

[needs]
# Network information (WebSocket + HTTPS to the Courtside API)
[[needs.privilege]]
id = "com.amazon.network.privilege.net-info"

[[needs.module]]
id = "/com.amazon.vega.os@IVega_1_2"

[[needs.module]]
id = "/com.amazon.kepler.async_storage__async_storage_2@IAsyncStorage__AsyncStorage_0"

[[needs.module]]
id = "/com.amazon.kepler.gesture_handler_2@IGestureHandler_0"

[[needs.module]]
id = "/com.amazon.kepler.keplerscript_2@IKeplerScript_1"

[[needs.module]]
id = "/com.amazon.kepler.reanimated_2@IReanimated_0"

[[needs.module]]
id = "/com.amazon.kepler.safe_area_context_2@ISafeAreaContext_0"

[[needs.module]]
id = "/com.amazon.kepler.screens_2@IScreens_0"

[[needs.module]]
id = "/com.amazon.kepler.svg_2@ISVG_0"

[[needs.module]]
id = "/com.amazon.kepler.navigation__core_7@INavigation__Core_0"

[[needs.module]]
id = "/com.amazon.kepler.navigation__elements_7@INavigation__Elements_0"

[[needs.module]]
id = "/com.amazon.kepler.navigation__native_7@INavigation__Native_0"

[[needs.module]]
id = "/com.amazon.kepler.navigation__native_stack_7@INavigation__NativeStack_0"

[[needs.module]]
id = "/com.amazon.kepler.navigation__routers_7@INavigation__Routers_0"













[offers]
[[offers.interaction]]
id = "com.courtside.tv.vega.main"

[[offers.module]]
id = "/com.courtside.tv.vega.main@IMod1"
includes-messages = [
    "pkg://com.courtside.tv.vega.main"
]

[[message]]
uri = "pkg://com.courtside.tv.vega.main"
sender-privileges = ["*"]
receiver-privileges = ["self"]
