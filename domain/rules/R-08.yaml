id: R-08
rule: "The Card shows one row per Layer needed by the Viewers present, lowest Layer first, each row labelled with its Viewers; OPEN - whose Layer answers a D-pad Why? (see questions.md Q3)"
status: proposed
kind: deterministic
source: "spec 2026-10-04 §4 (gap)"
examples:
  - id: R-08-a
    status: approved
    given: { present: [{ name: Leo, layer: basic }, { name: Ana, layer: basic }, { name: Raul, layer: tactical }] }
    when: { moment: shown }
    then: { rows: [{ layer: basic, viewers: [Leo, Ana] }, { layer: tactical, viewers: [Raul] }] }
  - id: R-08-b
    status: proposed
    given: { present: [{ name: Leo, layer: basic }, { name: Raul, layer: tactical }] }
    when: { dpad: "Why?" }
    then: { answer_layer: basic }
