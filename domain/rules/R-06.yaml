id: R-06
rule: A Question is answered on the TV at the Layer of the Viewer whose phone asked it, and is labelled with that Viewer's name.
status: proposed
kind: deterministic
source: "owner, chat 2026-10-04: sabe quién preguntó y le responde a su nivel"
examples:
  - id: R-06-a
    status: proposed
    given: { present: [{ name: Leo, level: beginner }, { name: Raul, level: expert }], phone_of: Leo }
    when: { question: "Why did the referee stop play?" }
    then: { answer_layer: basic, label: Leo }
  - id: R-06-b
    status: proposed
    given: { phone_paired: true, viewer_chosen: false }
    when: { question: "What is a corner?" }
    then: { accepted: false, phone_shows: "Pick who you are first" }
